<!DOCTYPE html>

<html class="dark" lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>企业认证</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#136dec",
              "background-light": "#f6f7f8",
              "background-dark": "#101822",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex items-center justify-between bg-background-light/80 px-4 py-3 backdrop-blur-sm dark:bg-background-dark/80">
<div class="flex h-10 w-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-zinc-800 dark:text-zinc-200">arrow_back</span>
</div>
<h1 class="flex-1 text-center text-lg font-bold text-zinc-900 dark:text-white">企业认证</h1>
<div class="h-10 w-10 shrink-0"></div> <!-- Spacer for centering title -->
</header>
<!-- Form Content -->
<main class="flex flex-1 flex-col px-4 pt-4 pb-28">
<!-- Enterprise Name TextField -->
<div class="mb-5 flex flex-wrap items-end gap-4">
<label class="flex flex-1 flex-col">
<p class="pb-2 text-base font-medium text-zinc-800 dark:text-zinc-200">企业名称</p>
<input class="form-input flex h-14 w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-zinc-300 bg-zinc-100 p-4 text-base font-normal leading-normal text-zinc-900 placeholder:text-zinc-400 focus:border-primary focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white dark:placeholder:text-zinc-500 dark:focus:border-primary" placeholder="请输入完整的公司名称" value=""/>
</label>
</div>
<!-- Social Credit Code TextField -->
<div class="mb-5 flex flex-wrap items-end gap-4">
<label class="flex flex-1 flex-col">
<div class="flex items-center pb-2">
<p class="text-base font-medium text-zinc-800 dark:text-zinc-200">统一社会信用代码</p>
<span class="material-symbols-outlined ml-1.5 cursor-pointer text-base text-zinc-500 dark:text-zinc-400">help_outline</span>
</div>
<div class="flex w-full flex-1 items-stretch">
<input class="form-input flex h-14 w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-zinc-300 bg-zinc-100 p-4 text-base font-normal leading-normal text-zinc-900 placeholder:text-zinc-400 focus:border-primary focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white dark:placeholder:text-zinc-500 dark:focus:border-primary" placeholder="请输入18位信用代码" value=""/>
</div>
</label>
</div>
<!-- Business License Upload -->
<div>
<p class="pb-2 text-base font-medium text-zinc-800 dark:text-zinc-200">营业执照照片</p>
<div class="flex cursor-pointer flex-col items-center gap-4 rounded-xl border-2 border-dashed border-zinc-400 bg-zinc-100/50 px-6 py-10 text-center transition-colors hover:border-primary hover:bg-primary/10 dark:border-zinc-600 dark:bg-zinc-800/50 dark:hover:border-primary">
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-3xl">add_photo_alternate</span>
</div>
<div class="flex flex-col items-center gap-1">
<p class="text-base font-bold text-zinc-900 dark:text-white">点击上传营业执照照片</p>
<p class="text-sm font-normal text-zinc-500 dark:text-zinc-400">请确保照片清晰、完整、无遮挡</p>
</div>
</div>
</div>
<!-- Helper Text -->
<p class="mt-auto pt-8 text-center text-xs text-zinc-500 dark:text-zinc-400">我们将在1-3个工作日内完成审核</p>
</main>
<!-- Floating Action Button -->
<div class="fixed bottom-0 left-0 right-0 z-10 bg-background-light/80 p-4 backdrop-blur-sm dark:bg-background-dark/80">
<button class="flex h-14 w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl bg-primary text-base font-bold leading-normal text-white shadow-lg shadow-primary/30 transition-colors hover:bg-primary/90 disabled:cursor-not-allowed disabled:bg-zinc-300 disabled:shadow-none dark:disabled:bg-zinc-700 dark:disabled:text-zinc-500">
<span class="truncate">提交审核</span>
</button>
</div>
</div>
</body></html>
