<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Select Location - Drone Pilot Service</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#007AFF", // Action Blue
              "background-light": "#f6f7f8",
              "background-dark": "#101822",
              "text-primary": "#1F1F1F",
              "text-secondary": "#8A8A8E",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pin {
            transform: translateY(-50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-screen w-full flex-col group/design-root overflow-hidden">
<!-- Interactive Map View -->
<div class="absolute inset-0 z-0">
<div class="h-full w-full bg-cover bg-center" data-alt="A light-themed, minimalist map showing streets and buildings." data-location="Shanghai" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDEpu7tE5FcVcz_6mm82HRUwZuzDZfsZCqljcUIAEv4Ec_bgHrHojQ69Z_fYZcBMhO9buEiDYtJgTcQJ7QsLmHTn4GyM1A_GNhj6d8o5cJ5qM_zocVEZU8-rQt6sIiQ4VyHm03He6vrbf0X5p75zo7718PhkFkxnauIexQghiVEmg4sLgbnzxhBlY2UvZXVPrUvI75NIBaDAV9RMxYkvM_5msQZttkqCHdgQ1ILfsRaxpTaDuWrpyXKcrAGT0FkhFxSTuLp7j0b7Kc");'></div>
</div>
<!-- Central Draggable Pin -->
<div class="absolute left-1/2 top-1/2 z-10 flex -translate-x-1/2 -translate-y-full flex-col items-center">
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary shadow-lg">
<span class="material-symbols-outlined text-3xl text-white">flight</span>
</div>
<div class="h-8 w-1 bg-primary"></div>
</div>
<!-- UI Overlay -->
<div class="relative z-20 flex h-full flex-col justify-between p-4 pt-6">
<!-- Top Section: Search Bar -->
<div class="flex flex-col">
<label class="flex flex-col min-w-40 h-14 shadow-lg rounded-lg">
<div class="flex w-full flex-1 items-stretch h-full">
<div class="text-[#8A8A8E] flex border-none bg-white items-center justify-center pl-4 rounded-l-lg border-r-0">
<span class="material-symbols-outlined">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#1F1F1F] focus:outline-0 focus:ring-0 border-none bg-white focus:border-none h-full placeholder:text-[#8A8A8E] px-4 rounded-l-none border-l-0 pl-2 text-base font-normal leading-normal" placeholder="Search for a location or address" value=""/>
</div>
</label>
</div>
<!-- Bottom Section: Actions and Details -->
<div class="flex flex-col gap-4">
<div class="flex justify-end">
<button class="flex h-14 w-14 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-primary text-white shadow-lg">
<span class="material-symbols-outlined text-3xl">my_location</span>
</button>
</div>
<!-- Location Details Card -->
<div class="flex flex-col gap-4">
<div class="flex items-center justify-between gap-4 rounded-lg bg-white p-4 shadow-lg">
<div class="flex flex-col gap-1 flex-1">
<p class="text-text-primary text-base font-bold leading-tight">The Bund, Shanghai</p>
<p class="text-text-secondary text-sm font-normal leading-normal">Zhongshan East 1st Rd, Waitan, Huangpu, China</p>
</div>
</div>
<!-- Primary Action Button -->
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-5 bg-primary text-white text-lg font-bold leading-normal tracking-wide">
<span>Confirm Location</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
