<!DOCTYPE html>

<html class="dark" lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>意见反馈</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#136dec",
              "background-light": "#f6f7f8",
              "background-dark": "#101822",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark">
<!-- Top App Bar -->
<header class="flex shrink-0 items-center justify-between border-b border-white/10 bg-background-light dark:bg-background-dark p-4 sticky top-0 z-10">
<button class="text-gray-400 dark:text-gray-300 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-white/10 active:bg-white/20">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold text-gray-900 dark:text-white">意见反馈</h1>
<div class="size-10 shrink-0"></div> <!-- Spacer for centering title -->
</header>
<main class="flex-1 px-4 py-6">
<div class="flex flex-col gap-8">
<!-- Feedback Content Section -->
<div>
<label for="feedback-content">
<h2 class="text-base font-semibold text-gray-800 dark:text-gray-200 pb-3">反馈内容</h2>
</label>
<div class="relative">
<textarea class="form-textarea w-full resize-none rounded-lg border border-gray-300 bg-gray-100 p-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 dark:border-white/20 dark:bg-white/10 dark:text-gray-100 dark:placeholder:text-gray-500 min-h-[160px]" id="feedback-content" placeholder="请详细描述您遇到的问题或建议..."></textarea>
<div class="absolute bottom-3 right-3 text-xs text-gray-500 dark:text-gray-400">0/500</div>
</div>
</div>
<!-- Image Upload Section -->
<div>
<h2 class="text-base font-semibold text-gray-800 dark:text-gray-200 pb-3">上传图片 <span class="text-sm font-normal text-gray-500 dark:text-gray-400">(可选，最多3张)</span></h2>
<div class="grid grid-cols-3 gap-4">
<div class="relative flex aspect-square cursor-pointer items-center justify-center rounded-lg border-2 border-dashed border-gray-300 dark:border-white/20 hover:border-primary dark:hover:border-primary transition-colors">
<span class="material-symbols-outlined text-4xl text-gray-400 dark:text-gray-500">add_photo_alternate</span>
</div>
<!-- Example of uploaded images -->
<div class="relative aspect-square overflow-hidden rounded-lg">
<img alt="A drone in flight against a cloudy sky." class="h-full w-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1RbfQtXFH1PINnOUTdCTLV_pLTUZ5-5HMgkxv7HV5F-gWwpw11Suhwa1JbiQ4kTe5hrd5z2M21kD2r2HS6mu9BDX0WEAaM4KRFEz8RUeZlpllS5gt2uLTU7rAgBFBcML1v9Y61j1XATh8OSomhdkCZCoRU4bxGxQDuwNd5BJuU2X3dsvSVyeppUUhGah5EzgDhbIefGIvmQNDraGk6WWGFrSNpFP96WwvAB6nR4M1gQ2cjF4GFSDzZhnre-rO7N8afW3N8S-gb18"/>
<button class="absolute top-1 right-1 flex h-6 w-6 items-center justify-center rounded-full bg-black/50 text-white backdrop-blur-sm">
<span class="material-symbols-outlined text-base">close</span>
</button>
</div>
</div>
</div>
<!-- Contact Info Section -->
<div>
<label for="contact-info">
<h2 class="text-base font-semibold text-gray-800 dark:text-gray-200 pb-3">联系方式 <span class="text-sm font-normal text-gray-500 dark:text-gray-400">(可选)</span></h2>
</label>
<input class="form-input w-full rounded-lg border border-gray-300 bg-gray-100 px-4 py-3 text-base text-gray-800 placeholder:text-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 dark:border-white/20 dark:bg-white/10 dark:text-gray-100 dark:placeholder:text-gray-500" id="contact-info" placeholder="请输入您的联系方式" type="text"/>
</div>
</div>
</main>
<!-- Submit Button -->
<footer class="sticky bottom-0 bg-background-light dark:bg-background-dark p-4 pt-2">
<button class="w-full rounded-lg bg-primary py-3.5 text-base font-semibold text-white transition-opacity hover:opacity-90 active:opacity-80 disabled:opacity-50 disabled:cursor-not-allowed">提交反馈</button>
</footer>
</div>
</body></html>
