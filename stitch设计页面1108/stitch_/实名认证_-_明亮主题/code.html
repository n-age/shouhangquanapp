<!DOCTYPE html>

<html class="light" lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>实名认证</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#136dec",
            "background-light": "#f6f7f8",
            "background-dark": "#101822",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative mx-auto flex h-auto min-h-screen w-full max-w-md flex-col bg-white dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-[#111418] dark:text-white" style="font-size: 24px;">arrow_back_ios_new</span>
</div>
<h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">实名认证</h2>
</div>
<!-- Page Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-3">
<div class="h-2 w-2 rounded-full bg-gray-300 dark:bg-gray-600"></div>
<div class="h-2 w-2 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-gray-300 dark:bg-gray-600"></div>
</div>
<!-- Body Text -->
<p class="text-gray-600 dark:text-gray-400 text-sm font-normal leading-normal pb-4 pt-1 px-4">根据平台规定，为保障服务安全，请完成实名认证</p>
<div class="flex flex-col px-4 pb-32">
<!-- Section Header -->
<h3 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] pt-4 pb-2">身份信息</h3>
<!-- Text Field: Full Name -->
<div class="flex max-w-[480px] flex-wrap items-end gap-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111418] dark:text-gray-200 text-base font-medium leading-normal pb-2">姓名</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white dark:placeholder:text-gray-500 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal" placeholder="请输入您的真实姓名" value=""/>
<p class="text-gray-500 dark:text-gray-400 text-xs mt-1.5">请确保姓名与身份证一致</p>
</label>
</div>
<!-- Text Field: ID Number -->
<div class="flex max-w-[480px] flex-wrap items-end gap-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111418] dark:text-gray-200 text-base font-medium leading-normal pb-2">身份证号</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white dark:placeholder:text-gray-500 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal" placeholder="请输入您的身份证号码" value=""/>
</label>
</div>
<!-- Section Header: Photo Upload -->
<h3 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] pt-6 pb-2">手持身份证照片</h3>
<!-- Image Uploader -->
<div class="mt-2 flex flex-col items-center justify-center rounded-lg border-2 border-dashed border-gray-300 dark:border-gray-600 px-6 pt-8 pb-8">
<div class="text-center">
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500" style="font-size: 48px;">add_a_photo</span>
<p class="mt-2 text-sm text-gray-600 dark:text-gray-400">点击上传手持身份证照片</p>
<p class="mt-1 text-xs text-gray-500 dark:text-gray-400">请确保照片清晰、完整，<a class="font-medium text-primary hover:text-primary/80" href="#">查看示例</a></p>
</div>
</div>
</div>
<!-- Fixed Bottom Section -->
<div class="fixed bottom-0 left-0 right-0 mx-auto w-full max-w-md bg-white dark:bg-background-dark p-4 pt-3 border-t border-gray-200 dark:border-gray-800">
<button class="flex w-full items-center justify-center rounded-lg bg-primary h-12 text-base font-bold text-white transition-colors duration-200 hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark disabled:bg-gray-300 dark:disabled:bg-gray-700 disabled:cursor-not-allowed">提交审核</button>
<p class="text-center text-xs text-gray-500 dark:text-gray-400 pt-3">我们承诺保障您的信息安全</p>
</div>
</div>
</body></html>
