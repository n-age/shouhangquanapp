<!DOCTYPE html>

<html class="dark" lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>我的订单</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#136dec",
              "background-light": "#f6f7f8",
              "background-dark": "#101822",
              "surface-dark": "#18222c",
              "text-primary-dark": "#E0E0E0",
              "text-secondary-dark": "#A0A0A0",
              "status-pending": "#FFA500",
              "status-success": "#2ECC71",
              "status-cancelled": "#888888",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex items-center bg-background-dark p-4 pb-2 justify-between border-b border-white/10">
<div class="flex size-12 shrink-0 items-center">
<span class="material-symbols-outlined text-text-primary-dark">arrow_back_ios_new</span>
</div>
<h1 class="text-text-primary-dark text-lg font-bold leading-tight flex-1 text-center">我的订单</h1>
<div class="flex w-12 items-center justify-end">
<button class="flex cursor-pointer items-center justify-center rounded-lg h-12 bg-transparent text-text-primary-dark p-0">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
</header>
<!-- Search and Filter Section -->
<div class="sticky top-[72px] z-10 bg-background-dark pt-2 pb-3">
<!-- SearchBar -->
<div class="px-4 py-3">
<label class="flex flex-col min-w-40 h-12 w-full">
<div class="flex w-full flex-1 items-stretch rounded-lg h-full">
<div class="text-text-secondary-dark flex border-none bg-surface-dark items-center justify-center pl-4 rounded-l-lg">
<span class="material-symbols-outlined">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-r-lg text-text-primary-dark focus:outline-0 focus:ring-0 border-none bg-surface-dark focus:border-none h-full placeholder:text-text-secondary-dark px-4 pl-2 text-base font-normal leading-normal" placeholder="搜索任务标题"/>
</div>
</label>
</div>
<!-- Chips -->
<div class="flex gap-3 px-4 overflow-x-auto pb-1">
<button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary pl-4 pr-4">
<p class="text-white text-sm font-medium leading-normal">全部</p>
</button>
<button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface-dark pl-4 pr-4">
<p class="text-text-primary-dark text-sm font-medium leading-normal">待支付</p>
</button>
<button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface-dark pl-4 pr-4">
<p class="text-text-primary-dark text-sm font-medium leading-normal">进行中</p>
</button>
<button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface-dark pl-4 pr-4">
<p class="text-text-primary-dark text-sm font-medium leading-normal">已完成</p>
</button>
<button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface-dark pl-4 pr-4">
<p class="text-text-primary-dark text-sm font-medium leading-normal">已取消</p>
</button>
</div>
</div>
<!-- Order List -->
<main class="flex-1 px-4 space-y-4 pb-4">
<!-- Card 1: Pending Payment -->
<div class="flex flex-col items-stretch justify-start rounded-xl bg-surface-dark p-4">
<div class="flex items-start justify-between gap-4 mb-3">
<p class="text-text-primary-dark text-lg font-bold leading-tight tracking-[-0.015em]">城市建筑航拍项目</p>
<span class="text-status-pending text-sm font-medium leading-normal">待支付</span>
</div>
<div class="flex flex-col gap-1 text-sm mb-4">
<p class="text-text-secondary-dark">订单金额：<span class="text-text-primary-dark font-medium">¥1,500.00</span></p>
<p class="text-text-secondary-dark">下单时间：<span class="text-text-primary-dark">2023-10-27 10:30</span></p>
</div>
<div class="flex flex-1 gap-3 flex-wrap justify-end border-t border-white/10 pt-4">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-white/10 text-text-primary-dark text-sm font-bold">
<span class="truncate">取消订单</span>
</button>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold">
<span class="truncate">去支付</span>
</button>
</div>
</div>
<!-- Card 2: In Progress -->
<div class="flex flex-col items-stretch justify-start rounded-xl bg-surface-dark p-4">
<div class="flex items-start justify-between gap-4 mb-3">
<p class="text-text-primary-dark text-lg font-bold leading-tight tracking-[-0.015em]">高速公路勘测飞行</p>
<span class="text-primary text-sm font-medium leading-normal">进行中</span>
</div>
<div class="flex flex-col gap-1 text-sm mb-4">
<p class="text-text-secondary-dark">订单金额：<span class="text-text-primary-dark font-medium">¥8,200.00</span></p>
<p class="text-text-secondary-dark">下单时间：<span class="text-text-primary-dark">2023-10-26 15:00</span></p>
</div>
<div class="flex flex-1 gap-3 flex-wrap justify-end border-t border-white/10 pt-4">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold">
<span class="truncate">确认完成</span>
</button>
</div>
</div>
<!-- Card 3: Completed -->
<div class="flex flex-col items-stretch justify-start rounded-xl bg-surface-dark p-4">
<div class="flex items-start justify-between gap-4 mb-3">
<p class="text-text-primary-dark text-lg font-bold leading-tight tracking-[-0.015em]">婚礼庆典跟拍服务</p>
<span class="text-status-success text-sm font-medium leading-normal">已完成</span>
</div>
<div class="flex flex-col gap-1 text-sm mb-4">
<p class="text-text-secondary-dark">订单金额：<span class="text-text-primary-dark font-medium">¥3,000.00</span></p>
<p class="text-text-secondary-dark">下单时间：<span class="text-text-primary-dark">2023-10-22 09:45</span></p>
</div>
<div class="flex flex-1 gap-3 flex-wrap justify-end border-t border-white/10 pt-4">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-white/10 text-text-primary-dark text-sm font-bold">
<span class="truncate">申请售后</span>
</button>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-white/10 text-text-primary-dark text-sm font-bold">
<span class="truncate">查看详情</span>
</button>
</div>
</div>
<!-- Card 4: Cancelled -->
<div class="flex flex-col items-stretch justify-start rounded-xl bg-surface-dark p-4">
<div class="flex items-start justify-between gap-4 mb-3">
<p class="text-text-primary-dark text-lg font-bold leading-tight tracking-[-0.015em]">农田植保喷洒任务</p>
<span class="text-status-cancelled text-sm font-medium leading-normal">已取消</span>
</div>
<div class="flex flex-col gap-1 text-sm mb-4">
<p class="text-text-secondary-dark">订单金额：<span class="text-text-primary-dark font-medium">¥5,500.00</span></p>
<p class="text-text-secondary-dark">下单时间：<span class="text-text-primary-dark">2023-10-20 18:20</span></p>
</div>
<div class="flex flex-1 gap-3 flex-wrap justify-end border-t border-white/10 pt-4">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-white/10 text-text-primary-dark text-sm font-bold">
<span class="truncate">重新下单</span>
</button>
</div>
</div>
<!-- Empty State -->
<div class="flex flex-col items-center justify-center py-20 text-center">
<span class="material-symbols-outlined text-text-secondary-dark text-6xl">upcoming</span>
<p class="mt-4 text-base text-text-secondary-dark">暂无相关订单</p>
<p class="mt-1 text-sm text-text-secondary-dark/70">尝试更改筛选条件或清除搜索</p>
</div>
</main>
</div>
</body></html>
