<!DOCTYPE html>

<html lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>飞手认证</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#136dec",
            "background-light": "#f6f7f8",
            "background-dark": "#101822",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex h-14 items-center justify-between border-b border-zinc-200/80 bg-background-light/80 px-4 backdrop-blur-sm dark:border-zinc-800/80 dark:bg-background-dark/80">
<div class="flex items-center">
<span class="material-symbols-outlined text-zinc-900 dark:text-zinc-100">arrow_back_ios_new</span>
</div>
<h1 class="flex-1 text-center text-lg font-bold text-zinc-900 dark:text-zinc-100 pr-6">飞手认证</h1>
</header>
<!-- Form Content -->
<main class="flex-1 px-4 py-6">
<div class="flex flex-col gap-6">
<!-- Certificate Type -->
<label class="flex w-full flex-col">
<p class="pb-2 text-base font-medium text-zinc-900 dark:text-zinc-100">证书类型</p>
<div class="relative">
<select class="form-select h-14 w-full appearance-none rounded-lg border border-zinc-200 bg-white p-4 pr-10 text-base text-zinc-900 placeholder:text-zinc-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 dark:placeholder:text-zinc-500">
<option disabled="" selected="">请选择证书类型</option>
<option value="caac">民航局UTC执照</option>
<option value="aopa">中国AOPA合格证</option>
<option value="asfc">ASFC证书</option>
</select>
<span class="material-symbols-outlined pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 dark:text-zinc-400">expand_more</span>
</div>
</label>
<!-- Certificate Number -->
<label class="flex w-full flex-col">
<p class="pb-2 text-base font-medium text-zinc-900 dark:text-zinc-100">证书编号</p>
<input class="form-input h-14 w-full rounded-lg border border-zinc-200 bg-white p-4 text-base text-zinc-900 placeholder:text-zinc-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 dark:placeholder:text-zinc-500" placeholder="请输入您的证书编号" value=""/>
</label>
<!-- Certificate Photo -->
<div class="flex flex-col">
<h3 class="text-base font-medium text-zinc-900 dark:text-zinc-100">证书照片</h3>
<p class="pt-1 text-sm text-zinc-500 dark:text-zinc-400">点击上传证书正面照片</p>
<div class="mt-3 flex aspect-[16/10] w-full cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-zinc-300 bg-white transition-colors hover:border-primary hover:bg-primary/5 dark:border-zinc-600 dark:bg-zinc-800 dark:hover:border-primary dark:hover:bg-primary/10">
<span class="material-symbols-outlined text-4xl text-zinc-400 dark:text-zinc-500">add_a_photo</span>
<p class="mt-2 text-sm font-medium text-zinc-600 dark:text-zinc-400">上传照片</p>
</div>
</div>
</div>
</main>
<!-- Sticky Footer with Submit Button -->
<footer class="sticky bottom-0 z-10 mt-auto bg-background-light p-4 dark:bg-background-dark">
<button class="h-12 w-full rounded-full bg-primary text-base font-bold text-white transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-40">提交审核</button>
</footer>
</div>
</body></html>
