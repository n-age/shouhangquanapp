<!DOCTYPE html>

<html class="dark" lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>飞手认证</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#136dec",
            "background-light": "#f6f7f8",
            "background-dark": "#101822",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex shrink-0 items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-slate-800 dark:text-white flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">飞手认证</h2>
<div class="w-10"></div>
</div>
<div class="flex-grow flex flex-col px-4">
<!-- Body Text -->
<p class="text-slate-600 dark:text-slate-400 text-sm font-normal leading-normal pb-6 pt-2">请提交您的有效飞手证书以完成认证</p>
<div class="space-y-6">
<!-- Certificate Type TextField -->
<label class="flex flex-col w-full">
<p class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal pb-2">证书类型</p>
<div class="relative">
<select class="form-select w-full appearance-none resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/50 h-14 placeholder:text-slate-500 dark:placeholder:text-slate-500 p-3.5 text-base font-normal leading-normal pr-10">
<option value="">请选择证书类型</option>
<option value="aopa">AOPA</option>
<option value="utc">UTC</option>
<option value="asfc">ASFC</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">expand_more</span>
</div>
</div>
</label>
<!-- Certificate Number TextField -->
<label class="flex flex-col w-full">
<p class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal pb-2">证书编号</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/50 h-14 placeholder:text-slate-500 dark:placeholder:text-slate-500 p-3.5 text-base font-normal leading-normal" placeholder="请输入证书编号" value=""/>
</label>
<!-- Photo Uploader -->
<div class="flex flex-col">
<p class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal pb-2">证书照片</p>
<div class="flex flex-col items-center gap-4 rounded-xl border-2 border-dashed border-slate-400 dark:border-slate-700 p-8 text-center bg-slate-100/50 dark:bg-slate-800/30">
<div class="flex size-14 items-center justify-center rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-3xl">add_a_photo</span>
</div>
<div class="flex max-w-[480px] flex-col items-center gap-1">
<p class="text-slate-900 dark:text-white text-base font-semibold leading-tight">点击上传证书照片</p>
<p class="text-slate-600 dark:text-slate-400 text-sm font-normal leading-normal">请上传清晰的证书正面照</p>
</div>
</div>
</div>
</div>
</div>
<!-- Sticky Footer with CTA -->
<div class="sticky bottom-0 mt-8 w-full bg-background-light dark:bg-background-dark p-4">
<button class="flex w-full min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-4 bg-primary text-white text-base font-bold leading-normal tracking-wide shadow-lg shadow-primary/30 hover:bg-primary/90 focus:outline-none focus:ring-4 focus:ring-primary/40">
<span class="truncate">提交审核</span>
</button>
</div>
</div>
</body></html>
